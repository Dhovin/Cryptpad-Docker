# ==============================================================================
# CryptPad Nginx Reverse Proxy Configuration (pad.dhovin.me)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pad.dhovin.me pad-sandbox.dhovin.me;

    # ACME challenge path for Let's Encrypt / Certbot renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pad.dhovin.me pad-sandbox.dhovin.me;

    # SSL Certificates (Must cover both pad.dhovin.me AND pad-sandbox.dhovin.me)
    ssl_certificate /etc/letsencrypt/live/pad.dhovin.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pad.dhovin.me/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/pad.dhovin.me/chain.pem;

    # Modern TLS Security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max body size for file uploads
    client_max_body_size 150M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. WebSocket endpoint (Crucial for real-time collaboration)
    # --------------------------------------------------------------------------
    location /cryptpad_websocket {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep websocket alive without timing out during editing
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --------------------------------------------------------------------------
    # 2. Main CryptPad HTTP Application Server
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # ACME challenge renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
}
