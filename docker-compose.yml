services:
  cryptpad:
    image: cryptpad/cryptpad:version-${CPAD_VERSION:-2026.5.1}
    container_name: cryptpad
    restart: unless-stopped
    environment:
      - CPAD_MAIN_DOMAIN=${CPAD_MAIN_DOMAIN:-pad.dhovin.me}
      - CPAD_SANDBOX_DOMAIN=${CPAD_SANDBOX_DOMAIN:-pad-sandbox.dhovin.me}
      - CPAD_CONF=/cryptpad/config/config.js
      - CPAD_INSTALL_ONLYOFFICE=${CPAD_INSTALL_ONLYOFFICE:-true}
      - TZ=${TZ:-UTC}
    volumes:
      # Data storage paths (filesystem database)
      - ./data/blob:/cryptpad/blob
      - ./data/block:/cryptpad/block
      - ./data/data:/cryptpad/data
      - ./data/files:/cryptpad/datastore
      # User customisations (logos, colors, application config)
      - ./customize:/cryptpad/customize
      # OnlyOffice builds and configuration
      - ./onlyoffice-dist:/cryptpad/www/common/onlyoffice/dist
      - ./onlyoffice-conf:/cryptpad/onlyoffice-conf
      # CryptPad configuration file
      - ./config/config.js:/cryptpad/config/config.js:ro
    ports:
      # Host port 3010 forwards to container internal 3000
      - "${CPAD_HTTP_PORT:-3010}:3000"
      # Host port 3013 forwards to container internal 3003 (WebSocket)
      - "${CPAD_WEBSOCKET_PORT:-3013}:3003"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/checkup/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
